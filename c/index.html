<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SoundSheet — Shared checklist</title>
<style>
  :root { --bg:#f4f1ea; --card:#fff; --line:#e4ded1; --ink:#1c1a17; --muted:#7c756a;
          --accent:#2f8ff0; --green:#2ea36b; --amber:#d98a2b; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); }
  .wrap { max-width:640px; margin:0 auto; padding:16px; }
  header { padding:20px 4px 12px; }
  h1 { font-size:22px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          margin:12px 0; overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 14px;
         border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .cb { width:24px; height:24px; flex:0 0 auto; accent-color:var(--green); }
  .nm { flex:1; min-width:0; }
  .nm b { font-weight:600; }
  .meta { color:var(--muted); font-size:13px; }
  .qty { color:var(--muted); font-variant-numeric:tabular-nums; }
  .done b { text-decoration:line-through; color:var(--muted); }
  .tag { font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px;
         background:rgba(217,138,43,.15); color:var(--amber); }
  .sec { font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);
         margin:18px 4px 6px; }
  form { display:flex; gap:8px; margin-top:8px; }
  input[type=text], input[type=number] { font:inherit; padding:11px 12px; border:1px solid var(--line);
         border-radius:10px; background:var(--card); color:var(--ink); }
  input[type=text] { flex:1; min-width:0; }
  input[type=number] { width:74px; }
  button { font:inherit; font-weight:600; padding:11px 16px; border:0; border-radius:10px;
           background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); padding:8px; }
  .foot { text-align:center; color:var(--muted); font-size:12px; margin:22px 0; }
  .empty { color:var(--muted); padding:18px 14px; text-align:center; }
  .banner { background:rgba(47,143,240,.1); color:var(--accent); border-radius:10px;
            padding:10px 12px; font-size:14px; margin:8px 0; display:none; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17150f; --card:#221f18; --line:#332f26; --ink:#f0ece1; --muted:#9a9384; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Shared checklist</h1>
    <div class="sub" id="sub">Loading…</div>
  </header>
  <div class="banner" id="banner"></div>
  <div id="content"></div>
  <div class="foot">Powered by <a href="/">SoundSheet</a> · changes sync live</div>
</div>

<script>
const CODE = decodeURIComponent(location.pathname.replace(/^\/c\//,"").replace(/\/$/,""));
let NAME = localStorage.getItem("clName") || "";
let state = null, timer = null;

const api = (path, opts) => fetch("/api/checklist" + path, opts).then(r => r.json());
const esc = s => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function ensureName() {
  if (NAME) return true;
  const n = (prompt("Your name (so the owner knows who ticked what):") || "").trim();
  if (!n) return false;
  NAME = n; localStorage.setItem("clName", n); return true;
}

async function load() {
  if (!CODE) { document.getElementById("sub").textContent = "No checklist code."; return; }
  const data = await api("/" + CODE).catch(() => ({ found:false }));
  if (!data.found) {
    document.getElementById("sub").textContent = "Checklist not found. Check the link.";
    document.getElementById("content").innerHTML = "";
    return;
  }
  state = data;
  render();
}

function render() {
  document.getElementById("title").textContent = state.title || "Shared checklist";
  const owner = state.ownerName ? "Shared by " + state.ownerName : "Shared checklist";
  const done = state.items.filter(i => i.checked).length;
  document.getElementById("sub").textContent =
    owner + " · " + done + "/" + state.items.length + " checked";

  const kit = state.items.filter(i => !i.isRequest);
  const reqs = state.items.filter(i => i.isRequest);
  let html = "";
  html += section("Kit", kit);
  if (reqs.length) html += section("Requests", reqs);
  html += `
    <div class="sec">Add a request</div>
    <form id="addf" autocomplete="off">
      <input type="text" id="addn" placeholder="Item (e.g. spare NP-F)" maxlength="80">
      <input type="number" id="addq" value="1" min="1" max="99">
      <button type="submit">Add</button>
    </form>`;
  document.getElementById("content").innerHTML = html;

  document.querySelectorAll(".cb").forEach(cb =>
    cb.addEventListener("change", () => toggle(cb.dataset.id, cb.checked)));
  document.getElementById("addf").addEventListener("submit", addRequest);
}

function section(title, items) {
  if (!items.length) return `<div class="sec">${title}</div><div class="card"><div class="empty">Nothing here yet.</div></div>`;
  let rows = items.map(i => `
    <label class="row ${i.checked ? "done" : ""}">
      <input type="checkbox" class="cb" data-id="${i.id}" ${i.checked ? "checked" : ""}>
      <span class="nm"><b>${esc(i.name)}</b>${i.isRequest ? ' <span class="tag">requested</span>' : ""}
        <div class="meta">${esc(i.category||"")}${i.checked && i.checkedBy ? " · ✓ " + esc(i.checkedBy) : ""}${i.addedBy && i.isRequest ? " · by " + esc(i.addedBy) : ""}</div>
      </span>
      ${i.quantity > 1 ? `<span class="qty">×${i.quantity}</span>` : ""}
    </label>`).join("");
  return `<div class="sec">${title}</div><div class="card">${rows}</div>`;
}

async function toggle(id, checked) {
  if (checked && !(await ensureName())) { load(); return; }
  // optimistic
  const it = state.items.find(x => x.id === id);
  if (it) { it.checked = checked; it.checkedBy = checked ? NAME : ""; }
  await api(`/${CODE}/items/${id}`, {
    method: "PATCH", headers: { "content-type": "application/json" },
    body: JSON.stringify({ checked, checkedBy: NAME }),
  }).catch(() => {});
}

async function addRequest(e) {
  e.preventDefault();
  const n = document.getElementById("addn").value.trim();
  if (!n) return;
  if (!(await ensureName())) return;
  const q = Math.max(1, parseInt(document.getElementById("addq").value || "1", 10));
  document.getElementById("addn").value = "";
  await api(`/${CODE}/items`, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ name: n, quantity: q, addedBy: NAME, isRequest: true }),
  }).catch(() => {});
  await load();
}

load();
// Poll for other people's changes; pause while the tab is hidden.
timer = setInterval(() => { if (!document.hidden) load(); }, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
